[workspace]
resolver = "3"
members = [ "crates/*" ]

[workspace.dependencies]
anyhow = "1.0.104"
bitfields = "3.1.0"
fqdn = "0.5.2"
futures = "0.3.34"
http = "1.5.0"
humantime = "2.4.0"
rand = "0.10.2"
dashmap = "6.2.1"
hdrhistogram = "7.6.0"
clap = {
    version = "4.6.6",
    features = [
        "derive"
    ]
}
tokio = {
    version = "1.53.1",
    features = [
        "full"
    ]
}
thiserror = "2.0.20"
tokio-util = {
    version = "0.7.19",
    features = [
        "net",
        "codec",
    ]
}
